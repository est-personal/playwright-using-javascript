name-template: 'Playwright - JavaScript Release v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: "✨ Features"
    labels:
      - testcase

  - title: "🐛 Fixes"
    labels:
      - bugfix

  - title: "🎯 Integration / Enhancement"
    labels:
      - integration

  - title: "🔄 CI/CD"
    labels:
      - cicd

  - title: "🔧 Refactoring"
    labels:
      - refactor

  - title: "📚 Documentation"
    labels:
      - documentation

change-template: "- #$NUMBER $TITLE (@$AUTHOR)"
change-title-escapes: '\<*_&'

template: |
  # 🚀 Release $RESOLVED_VERSION

  ## What's Changed

  $CHANGES

  ## Dependency Versions

  See the attached `dependency-versions.txt` release asset for the exact package versions.

  ## Contributors

  $CONTRIBUTORS

