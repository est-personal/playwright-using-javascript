# After creation of version, this will run and automatically created release notes
name: 🚀 Release Pipeline
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Generate Test Summary
        if: always()
        run: |
          node scripts/test-summary.js || true

      - name: Test Status
        if: always()
        run: |
          echo "Playwright Tests Result: ${{ steps.tests.outcome }}"

      - name: Verify Report Files
        if: always()
        run: |
          echo "=== REPORT FILES ==="
          find . -name "*.json"
          ls -la test-results || true

          echo "=== ROOT FILES ==="
          ls -la

      - name: Generate Release Metrics
        if: always()
        run: |

          TEST_STATUS="${{ steps.tests.outcome }}"

          if [ "$TEST_STATUS" = "success" ]; then
            TEST_STATUS="✅ Passed"
          else
            TEST_STATUS="❌ Failed"
          fi

          if [ ! -f slack-metrics.json ]; then
            echo "Metrics file missing"

            TOTAL=0
            PASSED=0
            FAILED=0
            FLAKY=0
            PASSRATE=0

          else

            TOTAL=$(jq -r '.total // 0' slack-metrics.json)
            PASSED=$(jq -r '.passed // 0' slack-metrics.json)
            FAILED=$(jq -r '.failed // 0' slack-metrics.json)
            FLAKY=$(jq -r '.flaky // 0' slack-metrics.json)
            PASSRATE=$(jq -r '.passRate // 0' slack-metrics.json)

          fi

          {
            echo "## 🧪 Automation Test Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---------|---------|"
            echo "| Test Execution | $TEST_STATUS |"
            echo "| Total Tests | $TOTAL |"
            echo "| Passed | $PASSED |"
            echo "| Failed | $FAILED |"
            echo "| Flaky | $FLAKY |"
            echo "| Pass Rate | $PASSRATE% |"
          } > release-summary.md

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Workflow Status
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Tag: ${{ github.ref_name }}"

      - name: Generate dependency list
        if: always()
        run: |
          echo "Dependency Versions - ${{ github.ref_name }}" > dependency-versions.txt
          echo "" >> dependency-versions.txt
          npm ls --depth=0 --json > deps.json
          node -e "
          const d=require('./deps.json');
          for(const [k,v] of Object.entries(d.dependencies||{}))
            console.log(`${k}: ${v.version}`);
          " >> dependency-versions.txt

      - name: Verify dependency file
        if: always()
        run: |
          ls -la
          cat dependency-versions.txt

      - name: Verify Generated Files
        if: always()
        run: |
          ls -la
          cat release-summary.md

      - name: Verify Release Assets
        if: always()
        run: |
          test -f release-summary.md
          test -f dependency-versions.txt
          echo "Release assets verified."

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dependency-versions.txt
            release-summary.md
          #generate_release_notes: true