# After creation of version, this will run and automatically created release notes
name: Release And Test

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Workflow Status
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Tag: ${{ github.ref_name }}"

      - name: Generate dependency list
        if: always()
        run: |
          echo "Dependency Versions - ${{ github.ref_name }}" > dependency-versions.txt
          echo "" >> dependency-versions.txt
          npm ls --depth=0 --json > deps.json
          node -e "
          const d=require('./deps.json');
          for(const [k,v] of Object.entries(d.dependencies||{}))
            console.log(`${k}: ${v.version}`);
          " >> dependency-versions.txt

      - name: Verify dependency file
        if: always()
        run: |
          ls -la
          cat dependency-versions.txt

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Playwright - JavaScript Release ${{ github.ref_name }}
          files: |
            dependency-versions.txt
          #generate_release_notes: true