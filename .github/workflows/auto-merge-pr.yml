name: Auto Merge PR

on:
  workflow_run:
    workflows:
      - Playwright Tests - Before Merging PR
    types:
      - completed

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR
        run: |
          gh pr merge \
            ${{ github.event.workflow_run.pull_requests[0].number }} \
            --squash \
            --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack - PR Merged
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎉 Pull Request Auto-Merged

              ✅ PR #${{ github.event.workflow_run.pull_requests[0].number }}
              📝 Title: ${{ github.event.workflow_run.pull_requests[0].title }}
              👤 Author: ${{ github.event.workflow_run.pull_requests[0].user.login }}

              📦 Repository: ${{ github.repository }}

              🤖 Triggered By: Successful Playwright Validation

              🔗 https://github.com/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}"
            }