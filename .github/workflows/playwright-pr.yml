name: Playwright Tests - Before Merging PR

permissions:
  contents: write
  pull-requests: write

env:
  CI: true

on:
  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      folder:
        description: Test folder to run
        required: true
        default: demo
        type: choice
        options:
          - practice
          - demo
          - all   

# Concurrency control
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Job timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Changed Files
        id: changed_files
        if: github.event_name == 'pull_request'
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json files \
            --jq '.files[].path' > files.txt

          {
            echo "FILES<<EOF"
            cat files.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "COUNT=$(wc -l < files.txt)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR Labels
        if: github.event_name == 'pull_request'
        id: labels
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json labels \
            --jq '.labels[].name' > labels.txt

          {
            echo "LABELS<<EOF"
            cat labels.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Get Node Version
        id: node
        run: |
          echo "VERSION=$(node -v)" >> $GITHUB_OUTPUT

      - name: Short SHA
        id: sha
        run: |
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: |
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Running ALL tests in Chromium for PR validation..."
              npx playwright test --project=chromium
            fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

              echo "Running folder and browser selected from workflow_dispatch..."

              FOLDER="tests/${{ inputs.folder }}"

              if [ "${{ inputs.folder }}" = "all" ]; then
                FOLDER="tests"
              fi

              if [ "${{ inputs.browser }}" = "all" ]; then
                  npx playwright test "$FOLDER"
              else
                  npx playwright test "$FOLDER" \
                  --project=${{ inputs.browser }}
              fi
            fi

      - name: Verify Playwright JSON Report
        if: always()
        run: |
          echo "===== Test Results ====="
          ls -R test-results || true
          echo "===== Playwright Report ====="
          ls -R playwright-report || true

      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Generate Folder Summary
        if: always()
        run: node scripts/test-summary.js

      - name: Read Folder Summary
        if: always()
        id: summary
        run: |
          {
            echo 'SUMMARY<<EOF'
            cat folder-summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Read Slack Metrics
        id: metrics
        if: always()
        run: |
          echo "TOTAL=$(jq -r '.total' slack-metrics.json)" >> $GITHUB_OUTPUT
          echo "PASSED=$(jq -r '.passed' slack-metrics.json)" >> $GITHUB_OUTPUT
          echo "FAILED=$(jq -r '.failed' slack-metrics.json)" >> $GITHUB_OUTPUT
          echo "FLAKY=$(jq -r '.flaky' slack-metrics.json)" >> $GITHUB_OUTPUT
          echo "SKIPPED=$(jq -r '.skipped' slack-metrics.json)" >> $GITHUB_OUTPUT
          echo "PASSRATE=$(jq -r '.passRate' slack-metrics.json)" >> $GITHUB_OUTPUT

      - name: Read Coverage
        id: coverage
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            echo "VALUE=$(cat coverage.txt)" >> $GITHUB_OUTPUT
          else
            echo "VALUE=📦 Modules Covered: N/A" >> $GITHUB_OUTPUT
          fi

      - name: Create Test Summary
        id: test_summary
        run: |
          {
            echo 'SUMMARY<<EOF'
            echo "*📊 Test Summary*"
            echo ""
            echo "🧪 Total: ${{ steps.metrics.outputs.TOTAL }}"
            echo "✅ Passed: ${{ steps.metrics.outputs.PASSED }}"
            echo "❌ Failed: ${{ steps.metrics.outputs.FAILED }}"
            echo "⚠️ Flaky: ${{ steps.metrics.outputs.FLAKY }}"
            echo "⏭️ Skipped: ${{ steps.metrics.outputs.SKIPPED }}"
            echo "📈 Pass Rate: ${{ steps.metrics.outputs.PASSRATE }}%"
            echo "${{ steps.coverage.outputs.VALUE }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Debug Problem Modules
        if: always()
        run: |
          echo "===== problem-modules.txt ====="
          cat problem-modules.txt || true

      - name: Debug Problem Modules Raw
        run: |
          cat -A problem-modules.txt

      - name: Read Problem Modules
        id: problems
        run: |
          cat problem-modules.txt > problem-modules-output.txt

      - name: Build Problem Modules
        id: problem_text
        run: |
          {
            echo "TEXT<<EOF"
            cat problem-modules-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM_SEC=$((DURATION_SEC % 60))
          echo "DURATION=${DURATION_MIN}m ${DURATION_REM_SEC}s" >> $GITHUB_ENV

      - name: Save Historical Metrics
        if: always()
        run: node scripts/save-history.js

      - name: Generate Trend Charts
        if: always()
        run: node scripts/generate-chart.js

      - name: Commit Historical Metrics
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add metrics/history.json

          git commit -m "Update QA metrics" || true

          git push

      - name: Publish Workflow Summary
        if: always()
        run: |
          {
            echo "# Playwright Test Summary"
            echo ""
            cat folder-summary.txt
            echo ""
            echo "Duration: ${{ env.DURATION }}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            allure-report/
            allure-results/
            test-results/
            folder-summary.txt
            metrics/
          retention-days: 14

      - name: Upload Failure Screenshots
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            test-results/**/*.png
          retention-days: 14

      - name: Set Slack Context
        id: slack_context
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "DETAILS<<EOF"
              echo ""
              echo "${{ steps.coverage.outputs.VALUE }}"
              echo ""
              echo "⚠️ Modules Requiring Attention:"
              echo "${{ steps.problems.outputs.PROBLEMS }}"
              echo "🧪 Execution Type: PR Validation"
              echo "🖥️ Runner: ubuntu-latest"
              echo "🟢 Node: ${{ steps.node.outputs.VERSION }}"
              echo "🖱️ Browser: chromium"
              echo "📁 Folder: all tests"
              echo "🤖 Auto Merge: Pending"
              echo "🔀 PR: #${{ github.event.pull_request.number }}"
              printf '%s\n' "📝 Title: ${{ github.event.pull_request.title }}"
              echo "👤 Author: ${{ github.event.pull_request.user.login }}"
              echo "🌿 Branch: ${{ github.head_ref }}"
              echo "👤 Triggered By: ${{ github.actor }}"
              echo ""
              echo "🔗 PR:"
              echo "${{ github.event.pull_request.html_url }}"
              echo "📄 Changed Files (${{ steps.changed_files.outputs.COUNT }}):"
              echo "${{ steps.changed_files.outputs.FILES }}"
              echo ""
              echo "🏷️ Labels:"
              echo "${{ steps.labels.outputs.LABELS }}"
              echo ""
              echo "EOF"
            } >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "DETAILS<<EOF"
              echo ""
              echo "${{ steps.coverage.outputs.VALUE }}"
              echo ""
              echo "⚠️ Modules Requiring Attention:"
              echo "${{ steps.problems.outputs.PROBLEMS }}"
              echo "🧪 Execution Type: Manual Execution"
              echo "🖥️ Runner: ubuntu-latest"
              echo "🟢 Node: ${{ steps.node.outputs.VERSION }}"
              echo "🖱️ Browser: ${{ inputs.browser }}"
              echo "📁 Folder: ${{ inputs.folder }}"
              echo "🤖 Auto Merge: N/A"
              echo "📊 Allure Report:"
              echo "Download from workflow artifacts"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Set Slack Status
        if: always()
        id: slack_status
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "ICON=✅" >> $GITHUB_OUTPUT
            echo "STATUS=Passed" >> $GITHUB_OUTPUT
          else
            echo "ICON=❌" >> $GITHUB_OUTPUT
            echo "STATUS=Failed" >> $GITHUB_OUTPUT
          fi

      - name: Create PR Info
        id: pr_info
        if: github.event_name == 'pull_request'
        run: |
          {
            echo 'INFO<<EOF'
            echo "*🔀 PR:* #${{ github.event.pull_request.number }}"
            echo "*👤 Author:* ${{ github.event.pull_request.user.login }}"
            echo "*🌿 Branch:* ${{ github.head_ref }}"
            echo "*🏷 Labels:* ${{ steps.labels.outputs.LABELS }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Get PR URL
        id: pr_url
        if: github.event_name == 'pull_request'
        run: |
          echo "URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT

      - name: Build Slack PR Info
        id: slack_pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo 'INFO<<EOF'
              echo "${{ steps.pr_info.outputs.INFO }}"
              echo ""
              echo "*🔗 Pull Request:*"
              echo "${{ steps.pr_url.outputs.URL }}"
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            {
              echo 'INFO<<EOF'
              echo "📋 Manual Execution"
              echo EOF
            } >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎉 Playwright Test Result",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.slack_status.outputs.ICON }} Playwright Tests ${{ steps.slack_status.outputs.STATUS }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*📦 Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*📅 Trigger:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*⏱ Duration:*\n${{ env.DURATION }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔖 Commit:*\n`${{ steps.sha.outputs.SHORT_SHA }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🟢 Node:*\n${{ steps.node.outputs.VERSION }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🖥 Runner:*\nubuntu-latest"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.test_summary.outputs.SUMMARY }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ Modules Requiring Attention*\n${{ steps.problems.outputs.PROBLEMS }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.slack_pr.outputs.INFO }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🔍 Open Workflow"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

      - name: Comment Summary On PR
        if: github.event_name == 'pull_request'
        run: |
          cat > pr-summary.md <<EOF
          ## ✅ Playwright Validation Complete

          ${{ steps.summary.outputs.SUMMARY }}

          Duration: ${{ env.DURATION }}

          Reports:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          gh pr comment \
            ${{ github.event.pull_request.number }} \
            --body-file pr-summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail Workflow If Tests Failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1