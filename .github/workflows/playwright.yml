name: Playwright Tests - Github Actions

env:
  CI: true

on:
  pull_request:
    branches:
      - main

  # Schedule Run
  schedule:
    # Runs at 6:30 AM UTC
    # PHT is UTC+8 and GitHub Actions cron schedules use UTC
    # Subtract 8 hours
    - cron: '30 6 * * *'

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Concurrency control
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Job timeout

    # ### Future Enhancement:
    # # Parallel Run (Future use)
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     browser:
    #       - chromium
    #       - firefox
    #       - webkit
    # ###

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     # Node.js cache

      # Playwright browser cache
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # - name: Debug connectivity
      #   run: |
      #     nslookup qaplayground.com
      #     curl -Iv https://qaplayground.com/practice/input-fields

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        # run: |
        #   if [ "${{ github.event_name }}" = "pull_request" ]; then
        #     echo "Running Chromium for PR validation..."
        #     npx playwright test --project=chromium
        #   elif [ "${{ github.event_name }}" = "schedule" ]; then
        #     echo "Running all browsers for scheduled execution..."
        #     npx playwright test
        #   else
        #     echo "Running browser selected from workflow_dispatch..."
        #     if [ "${{ inputs.browser }}" = "all" ]; then
        #       npx playwright test
        #     else
        #       npx playwright test --project=${{ inputs.browser }}
        #     fi
        #   fi
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running Chromium for PR validation..."
            npx playwright test --project=chromium
          else
            echo "Running browser selected from workflow_dispatch..."
            if [ "${{ inputs.browser }}" = "all" ]; then
              npx playwright test
            else
              npx playwright test --project=${{ inputs.browser }}
            fi
          fi
        # ### Future Enhancement:
        # # Parallel Run (Future use)
        # run: |
        #   npx playwright test --project=${{ matrix.browser }}
        # ###

      - name: Verify Playwright JSON Report
        if: always()
        run: |
          echo "===== Test Results ====="
          ls -R test-results || true
          echo "===== Playwright Report ====="
          ls -R playwright-report || true

      - name: Generate Folder Summary
        if: always()
        run: node scripts/test-summary.js

      - name: Read Folder Summary
        if: always()
        id: summary
        run: |
          {
            echo 'SUMMARY<<EOF'
            cat folder-summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM_SEC=$((DURATION_SEC % 60))
          echo "DURATION=${DURATION_MIN}m ${DURATION_REM_SEC}s" >> $GITHUB_ENV

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            folder-summary.txt
          retention-days: 14

      - name: Set Slack Context
        id: slack_context
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "DETAILS<<EOF"
              echo "🔀 PR: #${{ github.event.pull_request.number }}"
              echo "📝 Title: ${{ github.event.pull_request.title }}"
              echo "👤 Author: ${{ github.event.pull_request.user.login }}"
              echo "🌿 Branch: ${{ github.head_ref }}"
              echo ""
              echo "🔗 PR:"
              echo "${{ github.event.pull_request.html_url }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "DETAILS<<EOF"
              echo "🖱️ Browser: ${{ inputs.browser }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Set Slack Status
        if: always()
        id: slack_status
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "ICON=✅" >> $GITHUB_OUTPUT
            echo "STATUS=Passed" >> $GITHUB_OUTPUT
          else
            echo "ICON=❌" >> $GITHUB_OUTPUT
            echo "STATUS=Failed" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.slack_status.outputs.ICON }} Playwright Tests ${{ steps.slack_status.outputs.STATUS }}

                📦 Repository: ${{ github.repository }}

                ${{ steps.summary.outputs.SUMMARY }}

                ${{ steps.slack_context.outputs.DETAILS }}

                📅 Trigger: ${{ github.event_name }}
                ⏱ Duration: ${{ env.DURATION }}

                🔍 Workflow:
                <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }

      - name: Fail Workflow If Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  cross-browser:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Notify Slack Schedule Started
        if: matrix.browser == 'chromium'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 Scheduled Playwright execution started

              📦 Repository: ${{ github.repository }}

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     # Node.js cache

      # Playwright browser cache
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: |
          npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright Report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Fail Workflow If Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  notify-scheduled-run:
    needs: cross-browser
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack Scheduled Run Success
        if: needs.cross-browser.result == 'success'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Daily Playwright Health Check Passed

              📦 Repository: ${{ github.repository }}

              🌙 Trigger: Daily Scheduled Run
              🏃 Workflow Run: ${{ github.run_number }}

              ✅ Cross-browser scheduled run completed successfully
              ✅ Chromium: Passed
              ✅ Firefox: Passed
              ✅ WebKit: Passed

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }

      - name: Notify Slack Scheduled Run Failure
        if: needs.cross-browser.result != 'success'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Scheduled Playwright Run Failed

              📦 Repository: ${{ github.repository }}

              🌙 Trigger: Daily Scheduled Run

              One or more browser executions failed.

              🔍 Check workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }