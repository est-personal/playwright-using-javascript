name: Playwright Tests - Github Actions

env:
  CI: true

on:
  pull_request:
    branches:
      - main

  # Schedule Run
  schedule:
    # Runs at 10:50 (10:50 AM) UTC
    # Runs at 6:50 (18:50 AM) PHT
    # PHT is UTC+8 and GitHub Actions cron schedules use UTC
    # Subtract 8 hours
    - cron: '50 10 * * *'

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Concurrency control
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Job timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running Chromium for PR validation..."
            npx playwright test --project=chromium
          else
            echo "Running browser selected from workflow_dispatch..."
            if [ "${{ inputs.browser }}" = "all" ]; then
              npx playwright test
            else
              npx playwright test --project=${{ inputs.browser }}
            fi
          fi

      - name: Verify Playwright JSON Report
        if: always()
        run: |
          echo "===== Test Results ====="
          ls -R test-results || true
          echo "===== Playwright Report ====="
          ls -R playwright-report || true

      - name: Generate Folder Summary
        if: always()
        run: node scripts/test-summary.js

      - name: Read Folder Summary
        if: always()
        id: summary
        run: |
          {
            echo 'SUMMARY<<EOF'
            cat folder-summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM_SEC=$((DURATION_SEC % 60))
          echo "DURATION=${DURATION_MIN}m ${DURATION_REM_SEC}s" >> $GITHUB_ENV

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            folder-summary.txt
          retention-days: 14

      - name: Set Slack Context
        id: slack_context
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "DETAILS<<EOF"
              echo "🔀 PR: #${{ github.event.pull_request.number }}"
              echo "📝 Title: ${{ github.event.pull_request.title }}"
              echo "👤 Author: ${{ github.event.pull_request.user.login }}"
              echo "🌿 Branch: ${{ github.head_ref }}"
              echo ""
              echo "🔗 PR:"
              echo "${{ github.event.pull_request.html_url }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "DETAILS<<EOF"
              echo "🖱️ Browser: ${{ inputs.browser }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Set Slack Status
        if: always()
        id: slack_status
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "ICON=✅" >> $GITHUB_OUTPUT
            echo "STATUS=Passed" >> $GITHUB_OUTPUT
          else
            echo "ICON=❌" >> $GITHUB_OUTPUT
            echo "STATUS=Failed" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.slack_status.outputs.ICON }} Playwright Tests ${{ steps.slack_status.outputs.STATUS }}

                📦 Repository: ${{ github.repository }}

                ${{ steps.summary.outputs.SUMMARY }}

                ${{ steps.slack_context.outputs.DETAILS }}

                📅 Trigger: ${{ github.event_name }}
                ⏱ Duration: ${{ env.DURATION }}

                🔍 Workflow:
                <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }

      - name: Fail Workflow If Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  cross-browser:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Notify Slack Schedule Started
        if: matrix.browser == 'chromium'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 Scheduled Playwright execution started

              📦 Repository: ${{ github.repository }}

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: |
          npx playwright test --project=${{ matrix.browser }}

      - name: Save Browser Result
        if: always()
        run: |
          mkdir -p browser-results

          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM_SEC=$((DURATION_SEC % 60))

          case "${{ matrix.browser }}" in
            chromium)
              BROWSER_NAME="Chromium"
              ;;
            firefox)
              BROWSER_NAME="Firefox"
              ;;
            webkit)
              BROWSER_NAME="WebKit"
              ;;
            *)
              BROWSER_NAME="${{ matrix.browser }}"
              ;;
          esac

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "✅ ${BROWSER_NAME} - Passed (${DURATION_MIN}m ${DURATION_REM_SEC}s)" > browser-results/${{ matrix.browser }}.txt
          else
            echo "❌ ${BROWSER_NAME} - Failed (${DURATION_MIN}m ${DURATION_REM_SEC}s)" > browser-results/${{ matrix.browser }}.txt
          fi

      - name: Upload Browser Result (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-result-${{ matrix.browser }}
          path: browser-results/
          retention-days: 14
          # playwright-report/
          # test-results/

      - name: Upload Playwright Report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Fail Workflow If Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  notify-scheduled-run:
    needs: cross-browser
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set Schedule Status
        id: schedule_status
        run: |
          if [ "${{ needs.cross-browser.result }}" = "success" ]; then
            echo "ICON=✅" >> $GITHUB_OUTPUT
            echo "STATUS=Passed" >> $GITHUB_OUTPUT
          else
            echo "ICON=❌" >> $GITHUB_OUTPUT
            echo "STATUS=Failed" >> $GITHUB_OUTPUT
          fi

      - name: Download Browser Results
        uses: actions/download-artifact@v4
        with:
          pattern: browser-result-*
          merge-multiple: true
          path: browser-results

      - name: Generate Browser Summary
        id: browser_summary
        run: |
          {
            echo "RESULTS<<EOF"
            cat browser-results/*.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Browser Results
        run: |
          ls -R browser-results
          cat browser-results/*.txt

      - name: Notify Slack Scheduled Run
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.schedule_status.outputs.ICON }} Daily Playwright Health Check ${{ steps.schedule_status.outputs.STATUS }}

              📦 Repository: ${{ github.repository }}

              🌙 Trigger: Schedule
              🔢 Run Number: ${{ github.run_number }}

              Browser Results:
              ${{ steps.browser_summary.outputs.RESULTS }}

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>"
            }