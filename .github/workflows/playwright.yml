name: Playwright Tests - Github Actions

on:
  pull_request:
    branches:
      - main

  # Schedule Run
  schedule:
    # Runs at 7:00 AM
    - cron: '0 7 * * *'

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Concurrency control
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Job timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     # Node.js cache

      # Playwright browser cache
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # - name: Debug connectivity
      #   run: |
      #     nslookup qaplayground.com
      #     curl -Iv https://qaplayground.com/practice/input-fields

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running Chromium for PR validation..."
            npx playwright test --project=chromium
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running all browsers for scheduled execution..."
            npx playwright test
          else
            echo "Running browser selected from workflow_dispatch..."
            if [ "${{ inputs.browser }}" = "all" ]; then
              npx playwright test
            else
              npx playwright test --project=${{ inputs.browser }}
            fi
          fi

      - name: Verify Playwright JSON Report
        if: always()
        run: |
          echo "===== Test Results ====="
          ls -R test-results || true
          echo "===== Playwright Report ====="
          ls -R playwright-report || true

      - name: Generate Folder Summary
        if: always()
        run: node scripts/test-summary.js

      - name: Read Folder Summary
        if: always()
        id: summary
        run: |
          {
            echo 'SUMMARY<<EOF'
            cat folder-summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM_SEC=$((DURATION_SEC % 60))
          echo "DURATION=${DURATION_MIN}m ${DURATION_REM_SEC}s" >> $GITHUB_ENV

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            folder-summary.txt
          retention-days: 14

      - name: Notify Slack Success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Playwright Tests Passed

                📦 Repository: ${{ github.repository }}

                ${{ steps.summary.outputs.SUMMARY }}

                🔀 *PR:* #${{ github.event.pull_request.number }}
                📝 *Title:* ${{ github.event.pull_request.title }}
                👤 *Author:* ${{ github.event.pull_request.user.login }}
                🌿 *Branch:* ${{ github.head_ref }}

                ⏱ Duration: ${{ env.DURATION }}

                🔗 PR:
                ${{ github.event.pull_request.html_url }}

                🔍 Workflow:
                https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Notify Slack Failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Playwright Tests Failed

              📦 Repository: ${{ github.repository }}

              ${{ steps.summary.outputs.SUMMARY }}

              🔀 *PR:* #${{ github.event.pull_request.number }}
              📝 *Title:* ${{ github.event.pull_request.title }}
              👤 *Author:* ${{ github.event.pull_request.user.login }}
              🌿 *Branch:* ${{ github.head_ref }}

              ⏱ Duration: ${{ env.DURATION }}

              🔗 PR:
              ${{ github.event.pull_request.html_url }}

              🔍 Workflow:
              https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Fail Workflow If Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
