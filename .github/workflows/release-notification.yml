name: Release Notification

on:
  release:
    types:
      - published

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 New Release Published",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Playwright - JavaScript Release Published"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*📢 Event*\nPublished Release"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔖 Release ID*\n${{ github.event.release.id }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*📦 Repository*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🏷 Version*\n${{ github.event.release.tag_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*📝 Release*\n${{ github.event.release.name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*📅 Published*\n${{ github.event.release.published_at }}"
                    },
                    {
                    "type": "mrkdwn",
                    "text": "*👤 Author*\n${{ github.event.release.author.login }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🧪 Validation*\n✅ Passed"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ Playwright validation completed\n✅ Automation metrics attached (release-summary.md)\n✅ Dependency report attached (dependency-versions.txt)\n✅ Release notes generated by Release Drafter"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📋 Release notes generated by Release Drafter.\nOpen the release for full details."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📎 Release Assets (2)*\n• release-summary.md\n• dependency-versions.txt"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 View Release"
                      },
                      "url": "${{ github.event.release.html_url }}"
                    }
                  ]
                }
              ]
            }